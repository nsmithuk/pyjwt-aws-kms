# Installs dependencies with uv, then runs tests (unit tests across an OS/Python matrix,
# functional tests against Local KMS). Tagged releases are published to PyPI.

name: Test

on:
  push:
    branches: [ "**" ]
    tags: ["v*.*.*"]
  pull_request:
    branches: [ "main" ]

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest", "ubuntu-26.04-arm"]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}

    outputs:
      coverage: ${{ steps.get_coverage.outputs.coverage }}

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      run: uv sync

    - name: Lint and type check
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15' }}
      run: |
        uv run ruff check .
        uv run mypy src

    # Functional tests (marked "integration") need Local KMS; see the functional job.
    - name: Test with pytest
      run: |
        uv run pytest -m "not integration" --cov --cov-report=term --cov-report=json -vv

    - name: Extract coverage
      id: get_coverage
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15' }}
      run: |
        COVERAGE=$(jq -r '.totals.percent_covered | floor' coverage.json)
        echo "Coverage is: ${COVERAGE}%"
        echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

  # Unit tests against the oldest versions pyproject.toml allows, so the lower bounds stay honest.
  lowest-deps:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Install lowest direct dependencies
      run: uv sync --resolution lowest-direct

    - name: Test with pytest
      run: uv run pytest -m "not integration" -vv

  # Container services only run on Linux, so the functional tests get their own job.
  functional:
    runs-on: ubuntu-latest

    services:
      local-kms:
        image: nsmithuk/local-kms:4.0.0-rc.2
        ports:
          - 8080:8080
        env:
          KMS_SEED_PATH: /seed.yaml

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.15"
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      run: uv sync

    - name: Wait for Local KMS
      run: |
        for i in $(seq 1 30); do
          if curl -s -o /dev/null http://localhost:8080; then exit 0; fi
          sleep 1
        done
        echo "Local KMS did not start" >&2
        exit 1

    - name: Functional tests against Local KMS
      run: uv run pytest -m integration -vv

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lowest-deps, functional]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI Trusted Publishing (OIDC); no stored API token.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"

      - name: Check that tag version matches pyproject.toml
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION="$(uv version --short)"

          echo "Git tag version: $TAG_VERSION"
          echo "pyproject.toml version: $FILE_VERSION"

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match pyproject.toml version ($FILE_VERSION)"
            exit 1
          fi

      - name: Build package
        run: |
          uv build

          #List out what's in the package
          tar -tzf dist/*.tar.gz
          unzip -l dist/*.whl

      - name: Publish to PyPI
        # Prevent forks from blindly trying this.
        if: ${{ github.repository == 'nsmithuk/pyjwt-aws-kms' }}
        run: uv publish --trusted-publishing always

      - name: Create coverage badge
        # Prevent forks from blindly trying this. Skipped until a gist is configured.
        if: ${{ github.repository == 'nsmithuk/pyjwt-aws-kms' && vars.COVERAGE_GIST_ID != '' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: pyjwt-aws-kms.json
          label: Coverage
          message: "${{ needs.test.outputs.coverage }}%"
          color: green
