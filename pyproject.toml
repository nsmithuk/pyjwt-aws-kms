[project]
name = "pyjwt-aws-kms"
version = "0.1.0"
description = "Sign JWTs with PyJWT using asymmetric keys held in AWS KMS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Neil Smith", email = "neil@nsmith.net" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.6",
    "pyjwt[crypto]>=2.8",
]

[project.urls]
Homepage = "https://github.com/nsmithuk/pyjwt-aws-kms"
Repository = "https://github.com/nsmithuk/pyjwt-aws-kms"
Issues = "https://github.com/nsmithuk/pyjwt-aws-kms/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Local KMS running (run-local-kms.sh); skipped if unreachable",
]

[tool.coverage.run]
source = ["pyjwt_aws_kms"]

[dependency-groups]
dev = [
    "boto3-stubs[kms]>=1.44.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
